services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: myusername
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5432:5432"
    restart: always

  # Grafana with Tempo (traces), Loki (logs) and Prometheus, taking OTLP on 4317 (gRPC) and 4318 (HTTP).
  # Grafana is on 3001, since the frontend dev server has 3000. The app doesn't wait for it.
  lgtm:
    image: grafana/otel-lgtm:0.40.0
    ports:
      - "3001:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - lgtm-data:/data
    restart: always

volumes:
  lgtm-data:
